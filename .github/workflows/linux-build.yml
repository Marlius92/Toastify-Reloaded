name: Linux Build

on:
  push:
    branches: [ main ]
    paths:
      - "src/ToastifyReloaded.Linux/**"
      - "packaging/linux/**"
      - "scripts/build-linux*.sh"
      - "scripts/package-linux-*.sh"
      - "scripts/test-linux-ci.sh"
      - "scripts/test-linux-rc.sh"
      - ".github/workflows/linux-build.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "src/ToastifyReloaded.Linux/**"
      - "packaging/linux/**"
      - "scripts/build-linux*.sh"
      - "scripts/package-linux-*.sh"
      - "scripts/test-linux-ci.sh"
      - "scripts/test-linux-rc.sh"
      - ".github/workflows/linux-build.yml"
  workflow_dispatch:

jobs:
  linux-x64:
    name: Ubuntu 24.04 · x64 build + GUI smoke + packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            playerctl xbindkeys xdg-desktop-portal dbus-x11 \
            libx11-6 libice6 libsm6 libfontconfig1 libxext6 \
            libxrender1 libxrandr2 libxi6 libgl1 libglib2.0-0 \
            desktop-file-utils curl xvfb xauth file

      - name: Build Linux x64
        run: |
          chmod +x scripts/build-linux.sh
          ./scripts/build-linux.sh

      - name: Verify stable feature contract
        run: |
          grep -q 'Avalonia.Wayland' src/ToastifyReloaded.Linux/ToastifyReloaded.Linux.csproj
          grep -q 'Tmds.DBus' src/ToastifyReloaded.Linux/ToastifyReloaded.Linux.csproj
          grep -q 'TrayIcon.Icons' src/ToastifyReloaded.Linux/App.axaml
          grep -q 'GetSelfAndLogicalDescendants' src/ToastifyReloaded.Linux/Services/LocalizationService.cs
          grep -q 'SaveFilePickerAsync' src/ToastifyReloaded.Linux/MainWindow.axaml.cs
          grep -q 'CompatibilityGuardService' src/ToastifyReloaded.Linux/MainWindow.axaml.cs
          grep -q 'api.github.com/repos/Marlius92/Toastify-Reloaded/releases' src/ToastifyReloaded.Linux/Services/LinuxUpdateService.cs
          grep -q 'CustomTopColor' src/ToastifyReloaded.Linux/Models/LinuxSettings.cs
          grep -q 'ToastPosition' src/ToastifyReloaded.Linux/Models/LinuxSettings.cs
          grep -q 'MonitorCombo' src/ToastifyReloaded.Linux/MainWindow.axaml
          grep -q 'ToastFontCombo' src/ToastifyReloaded.Linux/MainWindow.axaml
          grep -q 'LinuxUpdateInstallerService' src/ToastifyReloaded.Linux/MainWindow.axaml.cs
          grep -q 'DownloadAndApplyAsync' src/ToastifyReloaded.Linux/Services/LinuxUpdateInstallerService.cs
          grep -q 'v1.4.0-linux' src/ToastifyReloaded.Linux/Services/LinuxUpdateService.cs
          grep -q 'ReleaseCandidate' src/ToastifyReloaded.Linux/Models/LinuxReleaseVersion.cs
          grep -q 'SELF-TEST RESULT: PASS' src/ToastifyReloaded.Linux/Services/LinuxSelfTestService.cs
          grep -q 'Custom' src/ToastifyReloaded.Linux/Models/ToastThemePalette.cs

      - name: Linux stable headless self-test
        run: |
          chmod +x scripts/test-linux-rc.sh
          ./scripts/test-linux-rc.sh

      - name: Linux GUI smoke test
        run: |
          chmod +x scripts/test-linux-ci.sh
          ./scripts/test-linux-ci.sh

      - name: Validate Linux desktop entry
        run: |
          desktop-file-validate packaging/linux/io.github.Marlius92.ToastifyReloaded.desktop

      - name: Package x64
        run: |
          chmod +x scripts/package-linux-tar.sh scripts/package-linux-deb.sh scripts/package-linux-appimage.sh
          ./scripts/package-linux-tar.sh
          ./scripts/package-linux-deb.sh
          ./scripts/package-linux-appimage.sh

      - name: Validate AppImage structure
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/toastify-appimage"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          (
            cd "$WORK"
            "$GITHUB_WORKSPACE/dist/ToastifyReloaded-Linux-x64.AppImage" --appimage-extract >/dev/null
          )
          test -x "$WORK/squashfs-root/AppRun"
          test -x "$WORK/squashfs-root/usr/bin/toastify-reloaded"
          test -x "$WORK/squashfs-root/usr/lib/toastify-reloaded/ToastifyReloaded.Linux"
          grep -Fq 'Exec=toastify-reloaded' "$WORK/squashfs-root/io.github.Marlius92.ToastifyReloaded.desktop"

      - name: Validate x64 deb
        shell: bash
        run: |
          set -euo pipefail

          DEB="$(find dist -maxdepth 1 -name 'toastify-reloaded_*_amd64.deb' -print -quit)"
          test -n "$DEB"
          test -s "$DEB"

          CONTENTS_FILE="$RUNNER_TEMP/toastify-deb-contents.txt"
          dpkg-deb --contents "$DEB" > "$CONTENTS_FILE"

          grep -Fq '/opt/toastify-reloaded/ToastifyReloaded.Linux' "$CONTENTS_FILE"
          grep -Fq '/usr/bin/toastify-reloaded' "$CONTENTS_FILE"
          grep -Fq '/usr/share/applications/io.github.Marlius92.ToastifyReloaded.desktop' "$CONTENTS_FILE"

      - name: Validate x64 artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/ToastifyReloaded-Linux-x64.tar.gz
          test -s dist/ToastifyReloaded-Linux-x64.AppImage
          test -x dist/ToastifyReloaded-Linux-x64.AppImage

          DEB="$(find dist -maxdepth 1 -name 'toastify-reloaded_*_amd64.deb' -print -quit)"
          test -n "$DEB"
          test -s "$DEB"

          TAR_CONTENTS="$RUNNER_TEMP/toastify-x64-tar-contents.txt"
          tar -tzf dist/ToastifyReloaded-Linux-x64.tar.gz > "$TAR_CONTENTS"
          grep -Fq 'ToastifyReloaded.Linux' "$TAR_CONTENTS"

          echo "=== x64 artifact sizes ==="
          ls -lh \
            dist/ToastifyReloaded-Linux-x64.tar.gz \
            dist/ToastifyReloaded-Linux-x64.AppImage \
            "$DEB"

          echo "=== x64 SHA-256 ==="
          sha256sum \
            dist/ToastifyReloaded-Linux-x64.tar.gz \
            dist/ToastifyReloaded-Linux-x64.AppImage \
            "$DEB"

      - uses: actions/upload-artifact@v7
        with:
          name: toastify-reloaded-linux-x64
          path: |
            dist/ToastifyReloaded-Linux-x64.tar.gz
            dist/ToastifyReloaded-Linux-x64.AppImage
            dist/toastify-reloaded_*_amd64.deb
            dist/linux-smoke-test.log
            dist/linux-release-self-test.log
          if-no-files-found: error

  linux-arm64:
    name: Ubuntu 24.04 · ARM64 cross-build + packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y file

      - name: Build Linux ARM64
        run: |
          chmod +x scripts/build-linux-arm64.sh
          ./scripts/build-linux-arm64.sh

      - name: Validate ARM64 executable
        shell: bash
        run: |
          set -euo pipefail

          test -x dist/linux-arm64/ToastifyReloaded.Linux

          FILE_INFO="$RUNNER_TEMP/toastify-arm64-file.txt"
          file dist/linux-arm64/ToastifyReloaded.Linux > "$FILE_INFO"
          cat "$FILE_INFO"
          grep -Eiq 'ARM aarch64|ARM64|aarch64' "$FILE_INFO"

      - name: Package ARM64
        run: |
          chmod +x scripts/package-linux-arm64-tar.sh scripts/package-linux-arm64-deb.sh
          ./scripts/package-linux-arm64-tar.sh
          ./scripts/package-linux-arm64-deb.sh

      - name: Validate ARM64 artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/ToastifyReloaded-Linux-arm64.tar.gz

          DEB="$(find dist -maxdepth 1 -name 'toastify-reloaded_*_arm64.deb' -print -quit)"
          test -n "$DEB"
          test -s "$DEB"

          DEB_INFO="$RUNNER_TEMP/toastify-arm64-deb-info.txt"
          dpkg-deb --info "$DEB" > "$DEB_INFO"
          grep -Fq 'Architecture: arm64' "$DEB_INFO"

          TAR_CONTENTS="$RUNNER_TEMP/toastify-arm64-tar-contents.txt"
          tar -tzf dist/ToastifyReloaded-Linux-arm64.tar.gz > "$TAR_CONTENTS"
          grep -Fq 'ToastifyReloaded.Linux' "$TAR_CONTENTS"

          echo "=== ARM64 artifact sizes ==="
          ls -lh \
            dist/ToastifyReloaded-Linux-arm64.tar.gz \
            "$DEB"

          echo "=== ARM64 SHA-256 ==="
          sha256sum \
            dist/ToastifyReloaded-Linux-arm64.tar.gz \
            "$DEB"

      - uses: actions/upload-artifact@v7
        with:
          name: toastify-reloaded-linux-arm64
          path: |
            dist/ToastifyReloaded-Linux-arm64.tar.gz
            dist/toastify-reloaded_*_arm64.deb
          if-no-files-found: error
