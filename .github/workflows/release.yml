name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish x64
        shell: pwsh
        run: .\scripts\publish.ps1 -Runtime win-x64 -SelfContained $true

      - name: Publish ARM64
        shell: pwsh
        run: .\scripts\publish.ps1 -Runtime win-arm64 -SelfContained $true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ToastifyModern-win-x64.zip
            dist/ToastifyModern-win-arm64.zip
