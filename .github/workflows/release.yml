name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build x64 installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Runtime win-x64

      - name: Build ARM64 installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Runtime win-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Toastify Reloaded ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/ToastifyReloaded-Setup-win-x64.exe
            dist/ToastifyReloaded-Setup-win-arm64.exe
