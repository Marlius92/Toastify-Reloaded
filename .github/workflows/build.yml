name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\ToastifyModern.sln

      - name: Build
        run: dotnet build .\ToastifyModern.sln -c Release --no-restore

      - name: Publish x64
        shell: pwsh
        run: .\scripts\publish.ps1 -Runtime win-x64 -SelfContained $true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToastifyModern-win-x64
          path: dist/ToastifyModern-win-x64.zip
