name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\ToastifyReloaded.sln

      - name: Build
        run: dotnet build .\ToastifyReloaded.sln -c Release --no-restore

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build Windows x64 installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Runtime win-x64

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToastifyReloaded-Setup-win-x64
          path: dist/ToastifyReloaded-Setup-win-x64.exe
