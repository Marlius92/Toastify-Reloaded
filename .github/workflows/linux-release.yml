name: Linux Release

on:
  push:
    tags:
      - "v*-linux"
      - "v*-linux-preview.*"
      - "v*-linux-rc.*"

jobs:
  release-linux:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            playerctl xbindkeys xdg-desktop-portal dbus-x11 \
            libx11-6 libice6 libsm6 libfontconfig1 \
            desktop-file-utils curl file

      - name: Build x64 and ARM64
        run: |
          chmod +x scripts/build-linux.sh scripts/build-linux-arm64.sh
          ./scripts/build-linux.sh
          ./scripts/build-linux-arm64.sh

      - name: Package release
        run: |
          chmod +x scripts/package-linux-*.sh
          ./scripts/package-linux-tar.sh
          ./scripts/package-linux-deb.sh
          ./scripts/package-linux-appimage.sh
          ./scripts/package-linux-arm64-tar.sh
          ./scripts/package-linux-arm64-deb.sh

      - name: Validate release package set
        shell: bash
        run: |
          set -euo pipefail

          X64_TAR="dist/ToastifyReloaded-Linux-x64.tar.gz"
          X64_APPIMAGE="dist/ToastifyReloaded-Linux-x64.AppImage"
          ARM64_TAR="dist/ToastifyReloaded-Linux-arm64.tar.gz"

          X64_DEB="$(find dist -maxdepth 1 -name 'toastify-reloaded_*_amd64.deb' -print -quit)"
          ARM64_DEB="$(find dist -maxdepth 1 -name 'toastify-reloaded_*_arm64.deb' -print -quit)"

          test -s "$X64_TAR"
          test -s "$X64_APPIMAGE"
          test -x "$X64_APPIMAGE"
          test -s "$ARM64_TAR"
          test -n "$X64_DEB"
          test -s "$X64_DEB"
          test -n "$ARM64_DEB"
          test -s "$ARM64_DEB"

          X64_TAR_LIST="$RUNNER_TEMP/x64-tar.txt"
          ARM64_TAR_LIST="$RUNNER_TEMP/arm64-tar.txt"
          X64_DEB_INFO="$RUNNER_TEMP/x64-deb-info.txt"
          ARM64_DEB_INFO="$RUNNER_TEMP/arm64-deb-info.txt"

          tar -tzf "$X64_TAR" > "$X64_TAR_LIST"
          tar -tzf "$ARM64_TAR" > "$ARM64_TAR_LIST"
          dpkg-deb --info "$X64_DEB" > "$X64_DEB_INFO"
          dpkg-deb --info "$ARM64_DEB" > "$ARM64_DEB_INFO"

          grep -Fq 'ToastifyReloaded.Linux' "$X64_TAR_LIST"
          grep -Fq 'ToastifyReloaded.Linux' "$ARM64_TAR_LIST"
          grep -Fq 'Architecture: amd64' "$X64_DEB_INFO"
          grep -Fq 'Architecture: arm64' "$ARM64_DEB_INFO"

          if [[ "${GITHUB_REF_NAME}" == "v1.4.0-linux" ]]; then
            grep -Fq 'Version: 1.4.0' "$X64_DEB_INFO"
            grep -Fq 'Version: 1.4.0' "$ARM64_DEB_INFO"
          fi

          (
            cd dist
            sha256sum \
              ToastifyReloaded-Linux-x64.tar.gz \
              ToastifyReloaded-Linux-x64.AppImage \
              toastify-reloaded_*_amd64.deb \
              ToastifyReloaded-Linux-arm64.tar.gz \
              toastify-reloaded_*_arm64.deb \
              > SHA256SUMS.txt
          )

          cat dist/SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Toastify Reloaded ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-preview.') || contains(github.ref_name, '-rc.') }}
          generate_release_notes: true
          files: |
            dist/ToastifyReloaded-Linux-x64.tar.gz
            dist/ToastifyReloaded-Linux-x64.AppImage
            dist/toastify-reloaded_*_amd64.deb
            dist/ToastifyReloaded-Linux-arm64.tar.gz
            dist/toastify-reloaded_*_arm64.deb
            dist/SHA256SUMS.txt
